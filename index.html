<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Estudio de certificaciones</title>
<style>
:root{--bg:#f5f6f3;--card:#fff;--ink:#1c2530;--mut:#5d6a78;--line:#dfe3e0;--acc:#0e6e66;--on:#fff;--ok:#1b7a45;--okbg:#e8f5ec;--bad:#b3322c;--badbg:#fdeceb;--warn:#8a5a00;--warnbg:#fff4d6;--soft:#eef1ee}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#shell{display:flex;min-height:100vh}#ct{flex:1;min-width:0}
#side{width:236px;flex:none;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;padding:.6rem .5rem;transition:width .15s}
#side.col{width:62px}#side.col .lb{display:none}
.sh{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}.sb{font-weight:700;line-height:1.2}
#side button,#top button{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;border:0;background:none;padding:.55rem .65rem;border-radius:8px}
#side button:hover{background:var(--soft)}#side button.on{background:var(--soft);font-weight:700;box-shadow:inset 3px 0 var(--acc)}
.ic{width:1.3rem;text-align:center;flex:none;font-size:1.1rem}.bd{margin-left:auto;font-size:.8rem;background:var(--acc);color:var(--on);border-radius:99px;padding:0 .5rem}
nav{flex:1}.sf{border-top:1px solid var(--line);padding-top:.4rem}#sh2{display:none}

@media(max-width:760px){#side{position:fixed;left:0;top:0;z-index:20;transform:translateX(-100%);width:250px;box-shadow:2px 0 12px #0004}#side.open{transform:none}#side.col{width:250px}#side.col .lb{display:inline}#top{display:flex}#sh2.show{display:block;position:fixed;inset:0;background:#0005;z-index:15}}
main{max-width:920px;margin:0 auto;padding:1.2rem 1rem 2rem}
h1{font-size:1.8rem;line-height:1.2;margin:.2rem 0 .4rem}h2{font-size:1.2rem;margin:1.6rem 0 .6rem}h3{font-size:1rem;margin:.8rem 0 .3rem}
button,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5rem .9rem;cursor:pointer}textarea{width:100%;min-height:90px;cursor:text;font-size:.8rem}
button:hover{border-color:var(--acc)}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.p{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}button.d{color:var(--bad);border-color:var(--bad)}button:disabled{opacity:.5;cursor:default}button.nv:not(:disabled){background:#111;color:#fff;border-color:#111;font-weight:600}[data-theme=dark] button.nv:not(:disabled){background:#f2f2f2;color:#111;border-color:#f2f2f2}button.nv:disabled{background:var(--soft);color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.2rem;margin:.8rem 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem}.stat b{display:block;font-size:1.9rem;line-height:1.1}.stat span,.mut{color:var(--mut);font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}.row label{display:flex;flex-direction:column;gap:.2rem;font-size:.9rem;color:var(--mut)}
.ans blockquote,.exp blockquote,blockquote{margin:.8rem 0;padding:.6rem .9rem;border-left:4px solid #d9a21b;background:rgba(217,162,27,.12);border-radius:6px}blockquote p{margin:0}.eyebrow{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--acc,#5b5bd6);font-weight:700;margin:0}.card.qrow{padding:.8rem 1rem}.qh{display:flex;flex-wrap:wrap;gap:.2rem .4rem;align-items:center}input[type=search]{padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}.tag{display:inline-block;font-size:.8rem;padding:.1rem .6rem;border-radius:99px;background:var(--soft);margin:0 .3rem .3rem 0}.tag.w{background:var(--warnbg);color:var(--warn)}
.opt{display:flex;gap:.7rem;align-items:flex-start;padding:.7rem .9rem;margin:.5rem 0;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card)}
.opt:has(input:checked){border-color:var(--acc)}.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}.opt input{margin-top:.35rem}.opt i{font-style:normal;font-weight:700;min-width:1.2rem}
.fields{margin:1rem 0}.fields h3{margin:.2rem 0}.frow{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:.65rem .8rem;margin:.45rem 0;border:1px solid var(--line);border-radius:10px;background:var(--card)}.frow.ok{background:var(--okbg);border-color:var(--ok)}.frow.bad{background:var(--badbg);border-color:var(--bad)}.frow .fl2{flex:1 1 240px;font-weight:600}.frow select{min-width:230px;max-width:100%;padding:.45rem .5rem;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}.pill{display:inline-block;padding:.4rem 1.1rem;border:1px solid var(--line);border-radius:999px;margin-left:.4rem;cursor:pointer;font-weight:600}.pill input{position:absolute;opacity:0;pointer-events:none}.pill:has(input:checked){background:var(--acc);color:var(--on);border-color:var(--acc)}.frow small{flex-basis:100%;color:var(--ok);font-weight:600}.banner{padding:.8rem 1rem;border-radius:10px;margin:1rem 0;font-weight:600}.banner.ok{background:var(--okbg);color:var(--ok)}.banner.bad{background:var(--badbg);color:var(--bad)}.banner.w{background:var(--warnbg);color:var(--warn)}
details{border:1px solid var(--line);border-radius:10px;margin:.6rem 0;background:var(--card)}summary{padding:.7rem 1rem;font-weight:600;cursor:pointer}details>div{padding:0 1rem .8rem}
.docref{list-style:none;margin:.4rem 0 .9rem -1.2rem;padding:.4rem .7rem;background:var(--soft);border-left:3px solid var(--acc);border-radius:6px;font-size:.92rem}.docref a,.links a{color:var(--acc)}
.tabs{display:flex;flex-wrap:wrap;gap:.3rem;border-bottom:1px solid var(--line);margin-bottom:.6rem}.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none}.tabs button[aria-selected=true]{border-color:var(--acc);font-weight:700}
.case{background:var(--soft);border-radius:10px;padding:.6rem 1rem;margin-bottom:1rem}.pane{max-height:320px;overflow:auto}
.opt pre{white-space:pre-wrap;word-break:break-word;margin:0;font-size:.9rem}.opt code{white-space:pre-wrap}
img{max-width:100%;height:auto;cursor:zoom-in;background:#fff;border-radius:6px}.map{display:flex;flex-wrap:wrap;gap:.3rem;margin:.6rem 0}.map button{padding:.2rem .55rem;font-size:.85rem}.map .d{background:var(--soft)}.map .c{border-color:var(--acc);font-weight:700}.map .f{border-color:#d97706;box-shadow:inset 0 -3px 0 #d97706}.map .ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.map .bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}.map .pt{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}.map .c{outline:2px solid var(--acc)}.rv{margin:.8rem 0}.rv h3{margin:.2rem 0}button.fl[aria-pressed="true"]{border-color:#d97706;background:#fff4e0;color:#92400e}
table{border-collapse:collapse;width:100%}td,th{padding:.4rem .5rem;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:30;padding:1rem}.dlg{background:var(--card);border-radius:12px;padding:1.2rem;max-width:420px;width:100%}
#totop{position:fixed;right:1rem;bottom:1rem;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--acc);color:var(--on);font-size:1.4rem;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);display:none;z-index:30;padding:0}#totop.show{display:block}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:8px;display:none;z-index:40}
footer{max-width:920px;margin:0 auto;padding:0 1rem 2rem;color:var(--mut);font-size:.85rem}
</style>
</head>

const EN={"Resultados del banco (no cuentan para las estadísticas)":"Question bank results (not counted in statistics)","Reiniciar resultados":"Reset results","Reiniciar":"Reset","¿Reiniciar todos los resultados del banco de preguntas? Las estadísticas no se modifican.":"Reset all question bank results? Statistics are not changed.","Completa las respuestas":"Complete the answers","Selecciona una opción en cada campo. Cada campo vale lo mismo.":"Select one option in each field. Every field is worth the same.","— elige —":"— choose —","Parcialmente correcta":"Partially correct","Puntuación":"Score","parcial":"partial","Revisar pregunta":"Mark question to review","Ejercicios visuales":"Visual exercises","No se responden aquí: se autoevalúan al terminar el simulacro.":"These are not answered here: you self-assess them after the exam.","Finalizar examen":"Finish exam","Revisar preguntas":"Review questions","¿Seguro que quieres salir del simulacro? Perderás todo el progreso del examen en curso: respuestas y marcas.":"Are you sure you want to leave the mock exam? You will lose all progress of the exam in progress: answers and marks.","Salir y perder el progreso":"Leave and lose progress","Marcar para revisar":"Mark for review","Marcada para revisar":"Marked for review","Revisar y finalizar":"Review and finish","Revisión antes de finalizar":"Review before finishing","Respondidas":"Answered","Marcadas para revisar":"Marked for review","Sin responder":"Unanswered","Ninguna":"None","Todas las preguntas":"All questions","Volver al examen":"Back to the exam","Entregar examen":"Submit exam","Aún tienes":"You still have","sin responder":"unanswered","y":"and","marcadas para revisar":"marked for review","¿Entregar el examen? No podrás cambiar más respuestas.":"Submit the exam? You will not be able to change any more answers.","Modo estudio":"Study mode","no cuenta para las estadísticas":"does not count toward statistics","Volver al listado":"Back to the list","Explicación detallada":"Detailed explanation","Todas sin ejercicios visuales":"All except visual exercises","Solo ejercicios visuales":"Visual exercises only","Todos los temas":"All topics","El documento de origen en inglés indica otra respuesta:":"The English source document lists a different answer:","Contrástalo con la documentación oficial antes de darla por buena.":"Check it against the official documentation before accepting it.","Pendientes de repaso":"Due for review","Inicio":"Home","Favoritas":"Favorites","Estadísticas":"Statistics","Repasar errores":"Review mistakes","Datos y ajustes":"Data & settings","Cambiar certificación":"Change certification","Tema":"Topic","Tema claro":"Light theme","Tema oscuro":"Dark theme","Estudio de certificaciones":"Certification study","Contraer o expandir menú":"Collapse or expand menu","No se pudo guardar el progreso en este navegador. Exporta una copia.":"Progress could not be saved in this browser. Export a copy.","Cancelar":"Cancel","Borrar":"Delete","Importar":"Import","Proyecto de estudio interno. Las respuestas proceden del documento de estudio y pueden estar desactualizadas: contrástalas con los enlaces oficiales de Microsoft Learn. No es un examen oficial.":"Internal study project. Answers come from the study document and may be out of date: check them against the official Microsoft Learn links. This is not an official exam.","No se pudo cargar el catálogo. Abre la app desde su dirección web (no como archivo local).":"The catalog could not be loaded. Open the app from its web address (not as a local file).","Elige una certificación":"Choose a certification","Cada certificación guarda su progreso por separado en este navegador.":"Each certification keeps its own progress in this browser.","preguntas":"questions","Estudiar":"Study","Cargando preguntas…":"Loading questions…","No se pudieron cargar las preguntas de esta certificación.":"The questions for this certification could not be loaded.","Las preguntas de esta certificación aún no es t taken a mock exam yet.","No hay preguntas con ese filtro todavía.":"There are no questions with that filter yet.","Opción única":"Single choice","Varias respuestas":"Multiple answers","Ejercicio visual":"Visual exercise","Caso de estudio":"Case study","Repetida":"Repeated","también nº":"also no.","Respuesta distinta a su par":"Answer differs from its pair","Contenido en español":"Content in Spanish","Pregunta":"Question","de":"of","Favorita":"Favorite","Selecciona":"Select","respuestas.":"answers.","Anterior":"Previous","Volver a resultados":"Back to results","Terminar":"Finish","Siguiente":"Next","Ejercicio visual: se autoevalúa al terminar el simulacro.":"Visual exercise: self-graded after the mock exam ends.","Mostrar respuesta":"Show answer","Comprobar respuesta":"Check answer","Elige una respuesta":"Choose an answer","Resumen":"Summary","Entorno existente":"Existing environment","Problemas":"Problems","Requisitos":"Requirements","Instrucciones":"Instructions","Todo el caso":"Whole case","Respuesta y explicación":"Answer and explanation","¿La acertaste?":"Did you get it right?","Sí":"Yes","No":"No","Correcta":"Correct","Incorrecta":"Incorrect","Respuesta correcta:":"Correct answer:","No se pudo detectar la respuesta correcta; consulta la explicación.":"The correct answer could not be detected; see the explanation.","¿Por qué es correcta?":"Why is it correct?","¿Por qué son incorrectas las demás?":"Why are the others incorrect?","¿Cómo de seguro estabas?":"How sure were you?","Lo sabía":"I knew it","Por descarte":"By elimination","No lo sabía":"I didn't know","Ajusta cuándo vuelve esta pregunta en el repaso.":"Adjusts when this question comes back in review.","Documentación oficial":"Official documentation","Sin enlaces en el documento.":"No links in the document.","Anotada como acertada":"Recorded as correct","Anotada como fallada":"Recorded as missed","Anotado":"Noted","Resultado del simulacro":"Mock exam result","Sesión terminada":"Session finished","correctas":"correct","ejercicios visuales para autoevaluar":"visual exercises to self-grade","Revisar preguntas":"Review questions","visual":"visual","correcta":"correct","incorrecta":"incorrect","Ver explicación":"See explanation","Volver al inicio":"Back to home","Esto reemplaza el progreso actual de esta certificación. ¿Continuar?":"This replaces the current progress for this certification. Continue?","Progreso importado":"Progress imported","El archivo no es un progreso válido de esta certificación":"The file is not valid progress for this certification","Tu progreso":"Your progress","Se guarda solo en este navegador.":"It is stored only in this browser.","preguntas practicadas":"questions practiced","favoritas":"favorites","Para llevarlo a otro navegador u ordenador, expórtalo e impórtalo allí.":"To move it to another browser or computer, export it and import it there.","Exportar progreso":"Export progress","Importar archivo":"Import file","Borrar progreso de esta certificación":"Delete progress for this certification","Importar pegando el texto":"Import by pasting text","Importar texto":"Import text","Si no se ha descargado ningún archivo, copia este texto y guárdalo.":"If no file was downloaded, copy this text and save it.","Copiar":"Copy","Copiado":"Copied","Selecciona el texto y cópialo":"Select the text and copy it","¿Borrar todo el progreso de esta certificación en este navegador? No se puede deshacer. Exporta antes una copia si quieres conservarlo.":"Delete all progress for this certification in this browser? This cannot be undone. Export a copy first if you want to keep it.","Progreso borrado":"Progress deleted","Seguridad y permisos":"Security and permissions","Control de versiones y despliegue":"Version control and deployment","Ingesta y orquestación":"Ingestion and orchestration","Spark y notebooks":"Spark and notebooks","T-SQL y Warehouse":"T-SQL and Warehouse","Streaming y KQL":"Streaming and KQL","Monitorización y rendimiento":"Monitoring and performance let lang=ls.get('certstudy:lang')||((navigator.language||'es').slice(0,2)==='en'?'en':'es');
const t=s=>lang==='en'&&EN[s]||s;
const INT=[0,1,2,4,7],DAY=864e5,TYPE={single:'Opción única',multi:'Varias respuestas',visual:'Ejercicio visual'};
let CAT=[],cert=null,P=null,Q=[],byId={},S={},ses=null,tmr=null,view='cat',cl='es';

setTheme(ls.get('certstudy:theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));

let BF={st:'',tp:'',cs:'',ty:'',rp:'',q:''};
function stOf(q){const a=A(q.id);return !a?'new':due(q.id)?'due':a.last?'ok':'bad'}
const STL={new:'Sin practicar',due:'Pendiente de repaso',ok:'Acertada',bad:'Con algún error'};
function bankList(){return Q.filter(q=>{const s=stOf(q.id);
  if(BF.st==='fav'?!S.favs.includes(q.id):BF.st&&s!==BF.st)return false;
  if(BF.tp&&q.topic!==BF.tp)return false;
  if(BF.cs==='none'?q.case:BF.cs&&q.case!==BF.cs)return false;
  if(BF.ty&&q.type!==BF.ty)return false;
  if(BF.rp==='rep'?!q.group:BF.rp==='diff'?!q.conflict:BF.rp==='uniq'&&q.group)return false;
  if(BF.q){const x=BF.q.toLowerCase().trim();if(!(String(q.n)===x||('#'+q.n)===x||(plain(q.stem)+' '+q.options.map(plain).join(' ')+' '+t(q.topic)).toLowerCase().includes(x)))return false}
  return true})}
function qRow(q){const s=stOf(q.id),cs=q.case&&P.cases[q.case];
  return`<div class="card qrow"><div class="qh"><b>${t('Pregunta')} ${q.n}</b><span class="tag">${esc(t(q.topic))}</span><span class="tag ${s==='bad'?'w':''}">${t(STL[s])}</span><span class="tag">${t(TYPE[q.type])}</span>${cs?`<span class="tag">${t('Caso de estudio')} · ${esc(cs.name)}</span>`:''}${q.group?`<span class="tag w">${t('Repetida')}</span>`:''}${q.conflict?`<span class="tag w">${t('respuesta distinta')}</span>`:''}${S.favs.includes(q.id)?'<span class="tag">★</span>':''}</div><p class="mut">${esc(plain(q.stem).slice(0,170))}…</p><div class="row"><button data-s="${q.id}">${t('Practicar')}</button></div></div>`}
function bank(){stop();view='bank';side();
  const topics=[...new Set(Q.map(q=>q.topic))].sort(),cases=Object.entries(P.cases||{});
  const sel=(k,o)=>`<select data-f="${k}">${o.map(([v,l])=>`<option value="${esc(v)}" ${BF[k]===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  app.innerHTML=`<p class="eyebrow">${t('Banco de estudio')}</p><h1>${t('Banco de preguntas')}</h1><p class="mut">${Q.length} ${t('preguntas')} · ${t('filtra por estado, temática o texto y abre la que te interese.')}</p>${langNote()}
  <div class="card"><div class="row">
  <label>${t('Estado')}${sel('st',[['',t('Todas')],['new',t('Sin practicar')],['due',t('Pendiente de repaso')],['ok',t('Acertada')],['bad',t('Con algún error')],['fav',t('Favoritas')]])}</label>
  <label>${t('Temática')}${sel('tp',[['',t('Todas')],...topics.map(x=>[x,t(x)])])}</label>
  <label>${t('Caso de estudio')}${sel('cs',[['',t('Todas')],['none',t('Sin caso de estudio')],...cases.map(([k,c])=>[k,c.name])])}</label>
  <label>${t('Tipo')}${sel('ty',[['',t('Todas')],...Object.keys(TYPE).filter(k=>Q.some(q=>q.type===k)).map(k=>[k,t(TYPE[k])])])}</label>
  <label>${t('Repetidas')}${sel('rp',[['',t('Todas')],['rep',t('Solo repetidas')],['uniq',t('Excluir repetidas')],['diff',t('Solo con respuesta distinta')]])}</label>
  <label style="flex:1;min-width:200px">${t('Buscar')}<input id="bq" type="search" value="${esc(BF.q)}" placeholder="${t('Número, tema o texto del enunciado')}"></label></div>
  <div class="row" style="margin-top:.8rem;justify-content:space-between"><span id="bc" class="mut"></span><span class="row"><button id="bp" class="p"></button><button id="bx">${t('Limpiar filtros')}</button></span></div></div><div id="bl"></div>`;
  const draw=()=>{const L=bankList();$('#bc').textContent=`${L.length} ${t('de')} ${Q.length} ${t('preguntas')}`;$('#bp').textContent=`${t('Practicar estas')} (${L.length})`;$('#bp').disabled=!L.length;
    $('#bl').innerHTML=L.length?L.slice(0,200).map(qRow).join('')+(L.length>200?`<p class="mut">${t('Se muestran las 200 primeras; afina los filtros.')}</p>`:''):`<div class="card mut">${t('Ninguna pregunta coincide con los filtros.')}</div>`};
  app.onchange=e=>{const f=e.target.dataset.f;if(f){BF[f]=e.target.value;draw()}};
  app.oninput=e=>{if(e.target.id==='bq'){BF.q=e.target.value;draw()}};
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.s){const l=bankList().map(q=>q.id);start(l.includes(b.dataset.s)?l:[b.dataset.s],'study',b.dataset.s)}if(b.id==='bp')start(bankList().map(q=>q.id),'study');if(b.id==='bx'){BF={st:'',tp:'',cs:'',ty:'',rp:'',q:''};bank()}};
  draw()}
function reps(){stop();view='rep';side();
  const groups=[...new Set(Q.filter(q=>q.group).map(q=>q.group))];
  app.innerHTML=`<h1>${t('Preguntas repetidas')}</h1><p class="mut">${t('Se conservan por si cambia alguna respuesta. Las marcadas “respuesta distinta” merecen revisión.')}</p>${langNote()}`+(groups.length?groups.map(g=>{const m=Q.filter(q=>q.group===g);return`<div class="card"><div class="row" style="justify-content:space-between"><b>${t('Preguntas')} ${m.map(q=>q.n).join(', ')} ${m.some(q=>q.conflict)?`<span class="tag w">${t('respuesta distinta')}</span>`:''}</b><button class="p" data-grp="${g}">${t('Repasar grupo')}</button></div>${m.map(q=>`<div class="row" style="justify-content:space-between;padding:.35rem 0;border-top:1px solid var(--line)"><span><b>${q.n}</b> · <span class="mut">${esc(plain(q.stem).slice(0,120))}…</span></span><button data-s="${q.id}">${t('Practicar')}</button></div>`).join('')}</div>`}).join(''):`<div class="card mut">${t('No hay preguntas repetidas.')}</div>`);
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.s){const l=groups.flatMap(g=>Q.filter(q=>q.group===g).map(q=>q.id));start(l,'study',b.dataset.s)}if(b.dataset.grp)start(Q.filter(q=>q.group===b.dataset.grp).map(q=>q.id),'study')}}
function favs(){stop();view='fav';side();const L=Q.filter(q=>S.favs.includes(q.id));
  app.innerHTML=`<h1>${t('Favoritas')}</h1>${langNote()}${L.length?`<p><button class="p" id="fp">${t('Practicar todas las favoritas')} (${L.length})</button></p>`:`<div class="card mut">${t('Aún no has marcado ninguna pregunta como favorita. Usa el botón ☆ mientras estudias.')}</div>`}`+L.map(q=>`<div class="card"><span class="tag">${esc(t(q.topic))}</span><span class="tag">nº ${q.n}</span><p>${esc(plain(q.stem).slice(0,180))}…</p><div class="row"><button data-s="${q.id}">${t('Estudiar')}</button><button data-u="${q.id}">${t('Quitar de favoritas')}</button></div></div>`).join('');
  if($('#fp'))$('#fp').onclick=()=>start(L.map(q=>q.id),'study');

function stats(){stop();view='stats';side();const ids=Object.keys(S.ans).filter(i=>byId[i]),ok=ids.filter(i=>A(i).last).length,topics=[...new Set(Q.map(q=>q.topic))].sort(),box=[1,2,3,4,5].map(b=>ids.filter(i=>A(i).box===b).length),ex=S.hist.filter(h=>h.mode==='exam').slice(-10).reverse();

  <h2>${t('Por tema')}</h2><div class="card" style="overflow:auto"><table><tr><th>${t('Tema')}</th><th>${t('Preguntas')}</th><th>${t('practicadas')}</th><th>${t('Acierto')}</th></tr>${topics.map(x=>{const l=Q.filter(q=>q.topic===x),a=l.filter(q=>A(q.id)),o=a.filter(q=>A(q.id).last).length;return`<tr><td>${esc(t(x))}</td><td>${l.length}</td><td>${a.length}</td><td>${a.length?Math.round(o/a.length*100)+' %':'–'}</td></tr>`}).join('')}</table></div>
  <h2>${t('Nivel de dominio (repaso espaciado)')}</h2><div class="card" style="overflow:auto"><table><tr>${box.map((_,i)=>`<th>${t('Nivel')} ${i+1}</th>`).join('')}</tr><tr>${box.map(n=>`<td>${n}</td>`).join('')}</tr></table></div>
  <h2>${t('Últimos simulacros')}</h2><div class="card">${ex.length?`<table>${ex.map(h=>`<tr><td>${fdate(h.t)}</td><td>${h.ok} / ${h.n}</td><td>${h.n?Math.round(h.ok/h.n*100):0} %</td></tr>`).join('')}</table>`:`<span class="mut">${t('Todavía no has hecho ningún simulacro.')}</span>`}</div>`;app.onclick=null}
Object.assign(VIEWS,{home,bank,rep:reps,fav:favs,stats,data:()=>settings()});
function build(o){let L=Q.slice();
  if(o.src==='new')L=L.filter(q=>!A(q.id));if(o.src==='wrong')L=L.filter(q=>A(q.id)&&!A(q.id).last);if(o.src==='due')L=L.filter(q=>due(q.id)).sort((a,b)=>A(a.id).due-A(b.id).due);
  if(o.src==='fav')L=L.filter(q=>S.favs.includes(q.id));if(o.src==='case')L=L.filter(q=>q.case);if(o.src==='novis')L=L.filter(q=>q.type!=='visual');if(o.src==='vis')L=L.filter(q=>q.type==='visual');if(o.topic)L=L.filter(q=>q.topic===o.topic);
  if(o.rep==='no')L=L.filter(q=>!q.repeat);if(o.rep==='only')L=L.filter(q=>q.group);if(o.rep==='diff')L=L.filter(q=>q.conflict);
  if(o.src!=='due')shuffle(L);const N=+o.n||50,K=cert&&cert.examCase;
  if(o.mode==='exam'&&K&&o.src!=='case'){const by={};L.forEach(q=>{if(q.case)(by[q.case]=by[q.case]||[]).push(q)});const ks=Object.keys(by).filter(k=>by[k].length>=K);
    if(ks.length){const k=ks[Math.floor(Math.random()*ks.length)],cs=by[k].slice(0,K).sort((a,b)=>a.n-b.n),rest=L.filter(q=>!q.case);return cs.concat(rest.slice(0,Math.max(0,N-K))).map(q=>q.id)}}
  return L.slice(0,N).map(q=>q.id)}
function start(ids,mode,i0){if(!ids.length){toast(t('No hay preguntas con ese filtro todavía.'));return}
  ses={mode,from:view,ids,i:Math.max(0,ids.indexOf(i0)),picks:{},checked:{},flags:{},rev:false,ctab:{}};if(mode==='exam'){ses.end=Date.now()+ids.length*90e3;tmr=setInterval(tick,1000)}question()}
function tick(){const e=$('#tm');if(!e)return;const s=Math.max(0,Math.round((ses.end-Date.now())/1e3));e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s)finish()}

/* ---------- pregunta ---------- */
function question(){const q=byId[ses.ids[ses.i]],study=ses.mode==='study',exam=ses.mode==='exam'&&!ses.rev,done=ses.checked[q.id]||ses.rev,pk=ses.picks[q.id]||[],cs=q.case&&P.cases[q.case],grp=q.group?Q.filter(x=>x.group===q.group&&x.id!==q.id):[],fav=S.favs.includes(q.id);
  view='quiz';side();
  const tags=`<span class="tag">${esc(t(q.topic))}</span><span class="tag">${t(TYPE[q.type])}</span>${cs?`<span class="tag">${t('Caso de estudio')} · ${esc(cs.name)}</span>`:''}${q.group?`<span class="tag w">${t('Repetida')} · ${t('también nº')} ${grp.map(x=>x.n).join(', ')||'–'}</span>`:''}${q.conflict?`<span class="tag w">${t('Respuesta distinta a su par')}</span>`:''}${lang!=='es'&&!q._tr?`<span class="tag w">${t('Contenido en español')}</span>`:''}`;
  const opts=q.options.map((o,k)=>{let c='';if(done&&q.type!=='visual')c=q.correct.includes(k)?'ok':pk.includes(k)?'bad':'';return`<label class="opt ${c}"><input type="${q.type==='multi'?'checkbox':'radio'}" name="o" value="${k}" ${pk.includes(k)?'checked':''} ${done?'disabled':''}><i>${String.fromCharCode(65+k)}</i><span>${o}</span></label>`}).join('');
  app.innerHTML=`<div class="row" style="justify-content:space-between"><span class="mut">${t('Pregunta')} ${ses.i+1} ${t('de')} ${ses.ids.length} (nº ${q.n})${study?` · <b>${t('Modo estudio')}</b> · ${t('no cuenta para las estadísticas')}`:''}</span>${exam?'<b id="tm"></b>':''}<span><button id="fav" aria-pressed="${fav}">${fav?'★ '+t('Favorita'):'☆ '+t('Favorita')}</button></span></div>
  ${study?`<div class="row" style="justify-content:space-between;align-items:center"><span class="mut">${t('Resultados del banco (no cuentan para las estadísticas)')}</span><button id="rbk">${t('Reiniciar resultados')}</button></div><div class="map">${ses.ids.map((id,k)=>`<button data-j="${k}" class="${bkc(id)} ${k===ses.i?'c':''}">${byId[id].n}</button>`).join('')}</div>`:''}
  ${exam?`<div class="map">${ses.ids.map((id,k)=>`<button data-j="${k}" class="${answered(byId[id])?'d':''} ${k===ses.i?'c':''} ${ses.flags[id]?'f':''}" title="${ses.flags[id]?t('Marcada para revisar'):''}">${k+1}</button>`).join('')}</div>`:''}
  <div class="card">${tags}${cs?caseHtml(q.case,cs):''}<div>${q.stem}</div>${q.type==='multi'?`<p class="mut">${t('Selecciona')} ${q.correct.length} ${t('respuestas.')}</p>`:''}<div id="o">${hasF(q)?fieldsHtml(q,done):opts}</div><div id="act"></div></div><div id="res"></div>
  <div class="row"><button id="pv" class="${study?'nv':''}" ${ses.i?'':'disabled'}>${t('Anterior')}</button>${study?`<button id="nx" class="nv" ${ses.i===ses.ids.length-1?'disabled':''}>${t('Siguiente')}</button><button id="bk">${t('Volver al listado')}</button>`:`<button id="nx" class="p" ${exam&&ses.i===ses.ids.length-1?'disabled':''}>${ses.i===ses.ids.length-1?(ses.rev?t('Volver a resultados'):exam?t('Siguiente'):t('Terminar')):t('Siguiente')}</button>${exam?`<button id="flg" class="fl" aria-pressed="${!!ses.flags[q.id]}">🚩 ${ses.flags[q.id]?t('Marcada para revisar'):t('Revisar pregunta')}</button><button id="fn" class="p" style="margin-left:auto">${t('Finalizar examen')}</button>`:''}`}</div>`;
  if(exam)tick();const act=$('#act');
  if(!done){if(selfA(q))act.innerHTML=exam?`<p class="mut">${t('Ejercicio visual: se autoevalúa al terminar el simulacro.')}</p>`:`<button class="p" id="sh">${t('Mostrar respuesta')}</button>`;else if(!exam)act.innerHTML=`<button class="p" id="ck">${t('Comprobar respuesta')}</button>`}
  $('#o').onchange=()=>{if(hasF(q)){ses.picks[q.id]=q.fields.map((f,i)=>{const r=document.querySelector(`#o input[name=f${i}]:checked`);if(r)return+r.value;const e=document.querySelector(`#o select[name=f${i}]`);return e&&e.value!==''?+e.value:-1});if(exam)document.querySelectorAll('.map [data-j]')[ses.i].classList.add('d')}else ses.picks[q.id]=[...document.querySelectorAll('#o input:checked')].map(i=>+i.value)};
  if($('#ck'))$('#ck').onclick=()=>{if(!answered(q)){toast(t('Elige una respuesta'));return}if(!study)record(q.id,grade(q));else{S.bk[q.id]=hasF(q)?score(q):(grade(q)?1:0);save()}ses.checked[q.id]=true;question()};
  if($('#sh'))$('#sh').onclick=()=>{ses.checked[q.id]=1;question()};
  if(done)feedback(q);
  if($('#rbk'))$('#rbk').onclick=()=>ask(t('¿Reiniciar todos los resultados del banco de preguntas? Las estadísticas no se modifican.'),()=>{S.bk={};save();ses.checked={};ses.picks={};question()},t('Reiniciar'));
  $('#fav').onclick=()=>{const i=S.favs.indexOf(q.id);i<0?S.favs.push(q.id):S.favs.splice(i,1);save();question()};
  $('#pv').onclick=()=>{ses.i--;question()};
  $('#nx').onclick=()=>{if(ses.i<ses.ids.length-1){ses.i++;question()}else if(study){}else if(ses.rev){ses.rev=false;results()}else if(ses.mode==='exam'){}else results()};
  if($('#fn'))$('#fn').onclick=review;if($('#flg'))$('#flg').onclick=()=>{ses.flags[q.id]?delete ses.flags[q.id]:ses.flags[q.id]=1;question()};
  if($('#bk'))$('#bk').onclick=()=>{(VIEWS[ses.from]||home)()};document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{ses.i=+b.dataset.j;question()});
  app.onclick=e=>{const x=e.target.closest('[data-t]');if(x){ses.ctab[q.case]=x.dataset.t;question();return}if(e.target.tagName==='IMG')window.open(e.target.src,'_blank')}}
const bkc=id=>{const v=S.bk[id];return v==null?'':v>=1?'ok':v<=0?'bad':'pt'};
const hasF=q=>q.type==='visual'&&q.fields&&q.fields.length,selfA=q=>q.type==='visual'&&!hasF(q);
const score=q=>{if(!hasF(q))return grade(q)?1:0;const p=ses.picks[q.id]||[];return q.fields.reduce((a,f,i)=>a+(p[i]===f.c?1:0),0)/q.fields.length};
const answered=q=>hasF(q)?(ses.picks[q.id]||[]).some(v=>v>=0):!!(ses.picks[q.id]&&ses.picks[q.id].length);
const fmt=x=>Number.isInteger(x)?String(x):x.toFixed(1).replace('.',lang==='en'?'.':',');
const optT=(f,k)=>f.yn?t(k?'No':'Sí'):f.o[k];
function fieldsHtml(q,done){const pk=ses.picks[q.id]||[];
  return`<div class="fields"><h3>${t('Completa las respuestas')}</h3><p class="mut">${t('Selecciona una opción en cada campo. Cada campo vale lo mismo.')}</p>${q.fields.map((f,i)=>{const v=pk[i]===undefined?-1:pk[i],c=done?(v===f.c?'ok':'bad'):'',lab=lang==='en'&&f.le?f.le:f.l;
    const ctl=f.yn?[0,1].map(k=>`<label class="pill"><input type="radio" name="f${i}" value="${k}" ${v===k?'checked':''} ${done?'disabled':''}>${optT(f,k)}</label>`).join(''):`<select name="f${i}" ${done?'disabled':''}><option value="">${t('— elige —')}</option>${f.o.map((o,k)=>`<option value="${k}" ${v===k?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    return`<div class="frow ${c}"><span class="fl2">${esc(lab)}</span><span>${ctl}</span>${done&&v!==f.c?`<small>${t('Correcta')}: ${esc(optT(f,f.c))}</small>`:''}</div>`}).join('')}</div>`}
const grade=q=>{if(hasF(q))return score(q)===1;const p=(ses.picks[q.id]||[]).slice().sort(),c=q.correct.slice().sort();return c.length>0&&p.length===c.length&&p.every((v,i)=>v===c[i])};
function caseHtml(k,cs){const tabs=cs.tabs.map(x=>[x.title,x.html]);if(cs.intro)tabs.push(['Instrucciones',cs.intro]);tabs.push(['Todo el caso',cs.tabs.map(x=>`<h3>${esc(t(x.title))}</h3>${x.html}`).join('')]);
  const cur=ses.ctab[k]&&tabs.some(x=>x[0]===ses.ctab[k])?ses.ctab[k]:tabs[0][0];
  return`<div class="case"><b>${esc(cs.name)}</b><div class="tabs" role="tablist">${tabs.map(x=>`<button role="tab" data-t="${esc(x[0])}" aria-selected="${x[0]===cur}">${esc(t(x[0]))}</button>`).join('')}</div><div class="pane">${tabs.find(x=>x[0]===cur)[1]}</div></div>`}
function feedback(q){const r=$('#res');let h='',pre='';
  if(hasF(q)){const sc=score(q),tot=q.fields.length,n=Math.round(sc*tot);pre=`<div class="banner ${sc===1?'ok':sc===0?'bad':'w'}">${sc===1?t('Correcta'):sc===0?t('Incorrecta'):t('Parcialmente correcta')} · ${n}/${tot} · ${t('Puntuación')}: ${fmt(Math.round(sc*1000)/10)} %</div>`}
  if(q.type==='visual'){const m=/^([\s\S]*?(?:Respuestas? correctas?|Correct answers?)[\s\S]*?<\/ul>)([\s\S]*)$/i.exec(q.answer.correct);
    h=m&&m[2].trim()?`<div class="card">${m[1]}</div><details><summary>${t('Explicación detallada')}</summary><div>${m[2]}</div></details>`:`<details open><summary>${t('Respuesta y explicación')}</summary><div>${q.answer.correct}</div></details>`;
    if(selfA(q)){h+=`<div class="card"><b>${t('¿La acertaste?')}</b> <button id="y">${t('Sí')}</button> <button id="n">${t('No')}</button></div>`;if(ses.mode==='study')h=h.replace(/<div class="card"><b>[^<]*<\/b> <button id="y">[\s\S]*?<\/div>$/,'')}}
  else{const ok=grade(q);h=q.correct.length?`<div class="banner ${ok?'ok':'bad'}">${ok?t('Correcta'):t('Incorrecta')} · ${t('Respuesta correcta:')} ${q.correct.map(k=>String.fromCharCode(65+k)).join(', ')}</div>`:`<div class="banner w">${t('No se pudo detectar la respuesta correcta; consulta la explicación.')}</div>`;
    h+=`<details><summary>${t('¿Por qué es correcta?')}</summary><div>${q.answer.correct}</div></details>${q.answer.incorrect?`<details><summary>${t('¿Por qué son incorrectas las demás?')}</summary><div>${q.answer.incorrect}</div></details>`:''}`;
    if(!ses.rev&&ses.mode==='practice')h+=`<div class="card"><b>${t('¿Cómo de seguro estabas?')}</b> <button data-c="knew">${t('Lo sabía')}</button> <button data-c="guess">${t('Por descarte')}</button> <button data-c="didnt">${t('No lo sabía')}</button><br><span class="mut">${t('Ajusta cuándo vuelve esta pregunta en el repaso.')}</span></div>`}
  h=pre+h;const u=[...new Map(q.links.map(l=>[l.u,l])).values()];
  h+=`<details class="card links"><summary><b>${t('Documentación oficial')}</b></summary><ul>${u.map(l=>`<li><a target="_blank" rel="noopener" href="${esc(l.u)}">${esc(l.t)}</a></li>`).join('')||`<li class="mut">${t('Sin enlaces en el documento.')}</li>`}</ul></details>`;
  r.innerHTML=h;
  if($('#y')){$('#y').onclick=()=>{record(q.id,true);toast(t('Anotada como acertada'));$('#y').parentNode.remove()};$('#n').onclick=()=>{record(q.id,false);toast(t('Anotada como fallada'));$('#n').parentNode.remove()}}
  r.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{conf(q.id,b.dataset.c);toast(t('Anotado'));r.querySelectorAll('[data-c]').forEach(x=>x.disabled=true)})}
function record(id,ok){const a=S.ans[id]||(S.ans[id]={box:1,n:0,ok:0});a.pb=a.box;a.n++;a.ok+=ok?1:0;a.last=ok;a.box=ok?Math.min(5,a.box+1):1;a.due=Date.now()+INT[a.box-1]*DAY;save()}
function conf(id,c){const a=A(id);if(!a)return;if(c==='didnt')a.box=1;else if(c==='guess'&&a.last)a.box=a.pb||1;a.due=Date.now()+INT[a.box-1]*DAY;save()}

/* ---------- resultados ---------- */
function review(){view='quiz';side();const vis=ses.ids.filter(id=>selfA(byId[id])),nv=ses.ids.filter(id=>!selfA(byId[id])),un=nv.filter(id=>!answered(byId[id])),fl=ses.ids.filter(id=>ses.flags[id]),btn=id=>`<button data-j="${ses.ids.indexOf(id)}" class="${ses.flags[id]?'f':''}">${ses.ids.indexOf(id)+1}</button>`;
  app.innerHTML=`<div class="row" style="justify-content:space-between"><h1>${t('Revisión antes de finalizar')}</h1><b id="tm"></b></div>
  <div class="card"><p>${t('Respondidas')}: <b>${nv.length-un.length}</b> / ${nv.length}</p>
  <div class="rv"><h3>🚩 ${t('Marcadas para revisar')} (${fl.length})</h3>${fl.length?`<div class="map">${fl.map(btn).join('')}</div>`:`<p class="mut">${t('Ninguna')}</p>`}</div>
  <div class="rv"><h3>${t('Sin responder')} (${un.length})</h3>${un.length?`<div class="map">${un.map(btn).join('')}</div>`:`<p class="mut">${t('Ninguna')}</p>`}</div>
  ${vis.length?`<div class="rv"><h3>${t('Ejercicios visuales')} (${vis.length})</h3><p class="mut">${t('No se responden aquí: se autoevalúan al terminar el simulacro.')}</p><div class="map">${vis.map(btn).join('')}</div></div>`:''}
  <div class="rv"><h3>${t('Todas las preguntas')}</h3><div class="map">${ses.ids.map(btn).join('')}</div></div></div>
  <div class="row"><button id="bkx">${t('Volver al examen')}</button><button id="sub" class="p">${t('Entregar examen')}</button></div>`;
  tick();document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{ses.i=+b.dataset.j;question()});
  $('#bkx').onclick=()=>{const f=fl[0]||un[0];ses.i=f?ses.ids.indexOf(f):0;question()};
  $('#sub').onclick=submit}
function submit(){const un=ses.ids.filter(id=>!selfA(byId[id])&&!answered(byId[id])),fl=ses.ids.filter(id=>ses.flags[id]);
  ask(un.length||fl.length?`${t('Aún tienes')} ${un.length} ${t('sin responder')} ${t('y')} ${fl.length} ${t('marcadas para revisar')}. ${t('¿Entregar el examen? No podrás cambiar más respuestas.')}`:t('¿Entregar el examen? No podrás cambiar más respuestas.'),finish,t('Entregar examen'))}
function finish(){clearInterval(tmr);ses.over=true;let ok=0,n=0,vis=0;ses.ids.forEach(id=>{const q=byId[id];if(selfA(q)){vis++;return}n++;const sc=score(q);ok+=sc;record(id,sc===1);ses.checked[id]=true});ok=Math.round(ok*100)/100;
  S.hist.push({t:Date.now(),mode:'exam',n,ok});S.hist=S.hist.slice(-50);save();results(ok,n,vis)}
function results(ok,n,vis){clearInterval(tmr);const ex=ses.mode==='exam';view='res';side();
  if(ok===undefined){n=ses.ids.filter(i=>!selfA(byId[i])).length;ok=Math.round(ses.ids.filter(i=>!selfA(byId[i])&&ses.checked[i]).reduce((a,i)=>a+score(byId[i]),0)*100)/100;vis=ses.ids.length-n}
  app.innerHTML=`<h1>${ex?t('Resultado del simulacro'):t('Sesión terminada')}</h1><div class="card stat"><b>${n?Math.round(ok/n*100)+' %':'–'}</b><span>${fmt(ok)} ${t('de')} ${n} ${t('correctas')}${vis?` · ${vis} ${t('ejercicios visuales para autoevaluar')}`:''}</span></div>
  <h2>${t('Revisar preguntas')}</h2><div class="card">${ses.ids.map((id,k)=>{const q=byId[id],g=selfA(q)?null:score(q);return`<div class="row" style="justify-content:space-between;padding:.25rem 0"><span>${k+1}. nº ${q.n} · ${esc(t(q.topic))} ${g===null?`<span class="tag">${t('visual')}</span>`:g===1?`<span class="tag" style="color:var(--ok)">${t('correcta')}</span>`:g>0?`<span class="tag w">${t('parcial')} ${Math.round(g*100)} %</span>`:`<span class="tag w">${t('incorrecta')}</span>`}</span><button data-r="${k}">${t('Ver explicación')}</button></div>`}).join('')}</div><p><button class="p" id="hm">${t('Volver al inicio')}</button></p>`;
  $('#hm').onclick=home;app.onclick=e=>{const r=e.target.dataset.r;if(r!==undefined){ses.i=+r;ses.rev=true;question()}}}

/* ---------- datos ---------- */
function exportJson(){return JSON.stringify({app:'certstudy',v:1,certId:cert.id,exported:new Date().toISOString(),data:S})}
function applyImport(txt){try{const j=JSON.parse(txt);if(j.app!=='certstudy'||j.certId!==cert.id||!j.data||typeof j.data.ans!=='object')throw 0;
  const ans={};for(const[k,v]of Object.entries(j.data.ans))if(byId[k]&&v&&typeof v==='object')ans[k]={box:Math.min(5,Math.max(1,+v.box||1)),pb:+v.pb||1,n:+v.n||0,ok:+v.ok||0,last:!!v.last,due:+v.due||0};
  ask(t('Esto reemplaza el progreso actual de esta certificación. ¿Continuar?'),()=>{S={ans,favs:(j.data.favs||[]).filter(i=>byId[i]),hist:Array.isArray(j.data.hist)?j.data.hist.slice(-50):[],lastExport:Date.now()};save();toast(t('Progreso importado'));home()},t('Importar'))}catch{toast(t('El archivo no es un progreso válido de esta certificación'))}}
function settings(){stop();view='data';side();const n=Object.keys(S.ans).length;
  app.innerHTML=`<h1>${t('Datos y ajustes')}</h1><div class="card"><h3>${t('Tu progreso')}</h3><p>${t('Se guarda solo en este navegador.')} ${n} ${t('preguntas practicadas')}, ${S.favs.length} ${t('favoritas')}. ${t('Para llevarlo a otro navegador u ordenador, expórtalo e impórtalo allí.')}</p>
  <div class="row"><button class="p" id="ex">${t('Exportar progreso')}</button><button id="im">${t('Importar archivo')}</button><input id="fi" type="file" accept=".json,application/json" hidden><button class="d" id="rs">${t('Borrar progreso de esta certificación')}</button></div>
  <div id="xb"></div><h3>${t('Importar pegando el texto')}</h3><textarea id="pt" placeholder="{ … }"></textarea><p><button id="pi">${t('Importar texto')}</button></p></div>`;
  $('#ex').onclick=()=>{S.lastExport=Date.now();save();const j=exportJson();try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=`progreso-${cert.id}-${new Date().toISOString().slice(0,10)}.json`;a.click()}catch{}
    $('#xb').innerHTML=`<p class="mut">${t('Si no se ha descargado ningún archivo, copia este texto y guárdalo.')}</p><textarea id="tx" readonly></textarea><p><button id="cp">${t('Copiar')}</button></p>`;$('#tx').value=j;
    $('#cp').onclick=()=>{$('#tx').select();let ok=false;try{ok=document.execCommand('copy')}catch{}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(j).then(()=>toast(t('Copiado')),()=>{});else toast(ok?t('Copiado'):t('Selecciona el texto y cópialo'))}};
  $('#im').onclick=()=>$('#fi').click();$('#fi').onchange=async e=>{if(e.target.files[0])applyImport(await e.target.files[0].text())};$('#pi').onclick=()=>applyImport($('#pt').value);
  $('#rs').onclick=()=>ask(t('¿Borrar todo el progreso de esta certificación en este navegador? No se puede deshacer. Exporta antes una copia si quieres conservarlo.'),()=>{ls.del(key());S={};load();toast(t('Progreso borrado'));settings()},t('Borrar'));app.onclick=null}
(function(){const b=document.createElement('button');b.id='totop';b.type='button';b.textContent='\u2191';b.setAttribute('aria-label','Volver arriba');b.title='Volver arriba';document.body.appendChild(b);
const u=()=>b.classList.toggle('show',(window.scrollY||document.documentElement.scrollTop)>600);addEventListener('scroll',u,{passive:true});u();
b.onclick=()=>window.scrollTo({top:0,behavior:'smooth'})})();
init();
</script>
